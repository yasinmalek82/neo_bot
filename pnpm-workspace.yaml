packages:
  - apps/*
  - packages/*

# Patched transitive fast-uri lines required by CI `pnpm audit --audit-level=high`.
# pnpm 11 reads overrides here, not from package.json#pnpm.
overrides:
  'fast-uri@^3': 3.1.6
  'fast-uri@^4': 4.1.3

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
