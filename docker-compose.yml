services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neo_bot
      POSTGRES_USER: neo_bot
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neo_bot -d neo_bot']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - neo_bot_postgres:/var/lib/postgresql/data

  bot-api:
    profiles: ['app']
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:3100'
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      DATABASE_URL: postgres://neo_bot:local-development-only@postgres:5432/neo_bot
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  neo_bot_postgres:
